[package]
name = "mdview"
version = "0.1.0"
edition = "2021"

[dependencies]
comrak = { version = "0.56", features = ["shortcodes"] }
ammonia = "4"
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
wry = { version = "0.57", features = ["linux-body"] }
tao = "0.37"
notify = "8"
gtk = "0.18"
base64 = "0.22"
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
